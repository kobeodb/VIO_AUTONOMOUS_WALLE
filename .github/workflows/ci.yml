name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build development image
        run: docker compose build

      - name: Run smoke test
        run: docker compose run --rm dev ./scripts/run_smoke.sh
