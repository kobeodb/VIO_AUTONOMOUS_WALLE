[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vio-tools"
version = "0.1.0"
description = "python tools for VIO WALLE project"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.basedpyright]
include = ["python", "tests/python"]
pythonVersion = "3.12"
executionEnvironments = [
    { root = ".", extraPaths = ["python"] }
]
